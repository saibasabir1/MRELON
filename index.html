<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MR ELON ALI — Ultimate Finance Manager</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

:root{
  --bg:#0a0b1e;
  --bg2:#12142d;
  --panel:rgba(255,255,255,0.05);
  --panel2:rgba(255,255,255,0.08);
  --line:rgba(255,255,255,0.08);
  --text:#ffffff;
  --muted:rgba(255,255,255,0.5);
  --primary:#6c5ce7;
  --primary-light:#a29bfe;
  --primary-dark:#4834d4;
  --cyan:#00cec9;
  --green:#00b894;
  --red:#fd79a8;
  --orange:#fdcb6e;
  --shadow:0 25px 50px -12px rgba(0,0,0,0.8);
  --glass:rgba(255,255,255,0.03);
  --radius:20px;
  --transition:all 0.3s cubic-bezier(0.4,0,0.2,1);
}

[data-theme="light"]{
  --bg:#f0f2f5;
  --bg2:#ffffff;
  --panel:rgba(0,0,0,0.03);
  --panel2:rgba(0,0,0,0.06);
  --line:rgba(0,0,0,0.08);
  --text:#1a1a2e;
  --muted:rgba(0,0,0,0.5);
  --shadow:0 25px 50px -12px rgba(0,0,0,0.15);
  --glass:rgba(255,255,255,0.8);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow-x:hidden}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font:14px 'Inter',system-ui,sans-serif;
  min-height:100vh;
  min-height:100dvh;
  transition:var(--transition);
  background-image: 
    radial-gradient(ellipse at 10% 20%, rgba(108,92,231,0.08) 0%, transparent 50%),
    radial-gradient(ellipse at 90% 80%, rgba(0,206,201,0.05) 0%, transparent 50%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}

::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:rgba(255,255,255,0.03)}
::-webkit-scrollbar-thumb{background:linear-gradient(135deg,var(--primary),var(--cyan));border-radius:10px}

button,input,select,textarea{font:inherit;transition:var(--transition)}
button{cursor:pointer;border:0;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(0.96)}
.hidden{display:none!important}

/* ====== BUTTONS ====== */
.btn{
  position:relative;
  padding:12px 24px;
  border-radius:14px;
  font-weight:700;
  font-size:13px;
  letter-spacing:0.3px;
  color:white;
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  box-shadow:0 4px 20px rgba(108,92,231,0.3);
  overflow:hidden;
  transition:var(--transition);
  text-transform:uppercase;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  min-height:48px;
  touch-action:manipulation;
  user-select:none;
  -webkit-user-select:none;
}
.btn::before{
  content:'';
  position:absolute;
  top:0;
  left:-100%;
  width:100%;
  height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.15),transparent);
  transition:left 0.6s ease;
}
.btn:hover::before{left:100%}
.btn:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 35px rgba(108,92,231,0.5);
}
.btn:active{transform:scale(0.96)}
.btn-secondary{
  background:var(--panel2);
  backdrop-filter:blur(10px);
  border:1px solid var(--line);
  box-shadow:0 4px 15px rgba(0,0,0,0.1);
  color:var(--text);
}
.btn-secondary:hover{background:rgba(255,255,255,0.12)}
.btn-success{
  background:linear-gradient(135deg,#00b894,#00cec9);
  box-shadow:0 4px 20px rgba(0,206,201,0.3);
}
.btn-danger{
  background:linear-gradient(135deg,#fd79a8,#e17055);
  box-shadow:0 4px 20px rgba(253,121,168,0.3);
}
.btn-warning{
  background:linear-gradient(135deg,#fdcb6e,#f39c12);
  box-shadow:0 4px 20px rgba(253,203,110,0.3);
}
.btn-glow{
  animation:glowPulse 2s ease-in-out infinite;
}
@keyframes glowPulse{
  0%,100%{box-shadow:0 4px 20px rgba(108,92,231,0.3)}
  50%{box-shadow:0 4px 40px rgba(108,92,231,0.6)}
}
.btn-small{padding:6px 14px;font-size:11px;min-height:34px;border-radius:10px}

/* ====== AUTH - REGISTER PAGE ====== */
.auth-page{
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:var(--bg);
  position:relative;
  overflow:hidden;
}

.auth-page::before{
  content:'';
  position:absolute;
  width:600px;
  height:600px;
  background:radial-gradient(circle,rgba(108,92,231,0.1),transparent);
  top:-200px;
  right:-200px;
  border-radius:50%;
  pointer-events:none;
}
.auth-page::after{
  content:'';
  position:absolute;
  width:400px;
  height:400px;
  background:radial-gradient(circle,rgba(0,206,201,0.08),transparent);
  bottom:-100px;
  left:-100px;
  border-radius:50%;
  pointer-events:none;
}

.auth-container{
  width:100%;
  max-width:440px;
  background:var(--panel);
  backdrop-filter:blur(30px);
  -webkit-backdrop-filter:blur(30px);
  border:1px solid var(--line);
  border-radius:30px;
  padding:40px 32px;
  box-shadow:0 50px 100px -20px rgba(0,0,0,0.5);
  position:relative;
  z-index:1;
  animation:slideUp 0.6s ease-out;
}
@keyframes slideUp{
  from{opacity:0;transform:translateY(30px)}
  to{opacity:1;transform:translateY(0)}
}

.auth-container .brand{
  text-align:center;
  font-size:30px;
  font-weight:900;
  letter-spacing:1px;
  margin-bottom:6px;
  background:linear-gradient(135deg,#fff 30%,var(--primary-light));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}
.auth-container .brand span{
  background:linear-gradient(135deg,var(--primary),var(--cyan));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}
.auth-container .subtitle{
  text-align:center;
  color:var(--muted);
  font-size:13px;
  margin-bottom:30px;
}

.auth-container .form-group{
  margin-bottom:18px;
}
.auth-container .form-group label{
  display:block;
  color:var(--muted);
  font-size:12px;
  font-weight:600;
  margin-bottom:5px;
  text-transform:uppercase;
  letter-spacing:0.5px;
}
.auth-container .form-group input{
  width:100%;
  padding:14px 16px;
  border-radius:14px;
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--text);
  outline:0;
  transition:var(--transition);
  font-size:15px;
}
.auth-container .form-group input:focus{
  border-color:var(--primary);
  box-shadow:0 0 30px rgba(108,92,231,0.08);
}
.auth-container .form-group input::placeholder{
  color:var(--muted);
}

.auth-container .auth-btn{
  width:100%;
  padding:16px;
  border-radius:14px;
  font-size:16px;
  font-weight:700;
  color:white;
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  box-shadow:0 4px 30px rgba(108,92,231,0.3);
  transition:var(--transition);
  text-transform:uppercase;
  letter-spacing:1px;
  margin-top:8px;
}
.auth-container .auth-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 40px rgba(108,92,231,0.5);
}
.auth-container .auth-btn:active{transform:scale(0.97)}

.auth-container .switch-link{
  text-align:center;
  margin-top:20px;
  color:var(--muted);
  font-size:14px;
}
.auth-container .switch-link a{
  color:var(--primary-light);
  text-decoration:none;
  font-weight:600;
  cursor:pointer;
  transition:var(--transition);
}
.auth-container .switch-link a:hover{color:var(--primary)}

/* ====== APP - DASHBOARD ====== */
.app{display:flex;min-height:100vh;min-height:100dvh}

.sidebar{
  width:260px;
  background:var(--bg);
  backdrop-filter:blur(20px);
  border-right:1px solid var(--line);
  padding:20px 14px;
  position:fixed;
  inset:0 auto 0 0;
  z-index:4;
  overflow-y:auto;
  height:100vh;
  height:100dvh;
}
.sidebar .brand{
  font-weight:900;
  font-size:20px;
  letter-spacing:1px;
  padding:6px 12px 24px;
  background:linear-gradient(135deg,#fff 30%,var(--primary-light));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}
.sidebar .brand span{
  background:linear-gradient(135deg,var(--primary),var(--cyan));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}

.sidebar nav button{
  display:block;
  width:100%;
  background:transparent;
  color:var(--muted);
  padding:11px 14px;
  text-align:left;
  border-radius:12px;
  margin:3px 0;
  font-weight:600;
  font-size:13px;
  transition:var(--transition);
  position:relative;
  touch-action:manipulation;
}
.sidebar nav button:hover{
  background:rgba(108,92,231,0.12);
  color:var(--text);
  transform:translateX(4px);
}
.sidebar nav button:active{transform:scale(0.97)}
.sidebar nav button.active{
  background:linear-gradient(135deg,rgba(108,92,231,0.2),rgba(0,206,201,0.08));
  color:var(--text);
}
.sidebar nav button.active::before{
  content:'';
  position:absolute;
  left:0;
  top:20%;
  height:60%;
  width:3px;
  background:linear-gradient(180deg,var(--primary),var(--cyan));
  border-radius:0 10px 10px 0;
}

.main{
  margin-left:260px;
  width:calc(100% - 260px);
  padding:16px 20px;
  max-width:1800px;
}

/* ====== HEADER ====== */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
  padding:14px 20px;
  background:var(--panel);
  backdrop-filter:blur(20px);
  border-radius:var(--radius);
  border:1px solid var(--line);
  flex-wrap:wrap;
  gap:10px;
}
.header-left .eyebrow{
  color:var(--muted);
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:2px;
}
.header-left .title{
  font-size:26px;
  font-weight:900;
  margin-top:2px;
  background:linear-gradient(135deg,var(--text) 60%,var(--primary-light));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}
.header-right{
  display:flex;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}
.theme-toggle{
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:50%;
  width:40px;
  height:40px;
  display:grid;
  place-items:center;
  font-size:18px;
  transition:var(--transition);
  color:var(--text);
  touch-action:manipulation;
}
.theme-toggle:active{transform:scale(0.9)}
.profile{
  display:flex;
  align-items:center;
  gap:10px;
}
.profile-avatar{
  width:44px;
  height:44px;
  border-radius:50%;
  overflow:hidden;
  border:2px solid var(--primary);
  cursor:pointer;
  transition:var(--transition);
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,var(--primary),var(--cyan));
  flex-shrink:0;
  touch-action:manipulation;
}
.profile-avatar:active{transform:scale(0.92)}
.profile-avatar img{width:100%;height:100%;object-fit:cover}
.profile-avatar .avatar-text{font-size:18px;font-weight:800;color:white}
.profile-info{text-align:right}
.profile-name{font-weight:700;font-size:14px}
.profile-actions{display:flex;gap:4px;margin-top:2px;flex-wrap:wrap}
.profile-actions button{
  background:rgba(108,92,231,0.12);
  color:var(--text);
  padding:2px 10px;
  border-radius:8px;
  font-size:10px;
  font-weight:600;
  border:1px solid var(--line);
  touch-action:manipulation;
}
.profile-actions button:active{transform:scale(0.9)}
#profilePicInput{display:none}

/* ====== CARDS ====== */
.grid{display:grid;gap:14px}
.cards{grid-template-columns:repeat(4,minmax(0,1fr))}
.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.three{grid-template-columns:repeat(3,minmax(0,1fr))}

.card{
  background:var(--panel);
  backdrop-filter:blur(20px);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:18px;
  box-shadow:var(--shadow);
  transition:var(--transition);
  position:relative;
  overflow:hidden;
}
.card:hover{transform:translateY(-3px)}
.stat{min-height:100px}
.stat .icon{font-size:22px}
.stat .amount{
  font-size:24px;
  font-weight:900;
  margin:6px 0 0;
  background:linear-gradient(135deg,var(--text) 60%,var(--primary-light));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}
.stat .label{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:1px;font-weight:600}
.positive{color:var(--green)}
.negative{color:var(--red)}
.accent{color:var(--cyan)}

.toolbar{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center;
  margin:12px 0;
}
.toolbar input,.toolbar select{
  flex:1;
  min-width:120px;
}

input,select,textarea{
  width:100%;
  padding:10px 14px;
  border-radius:12px;
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--text);
  outline:0;
  transition:var(--transition);
  font-size:14px;
}
input:focus,select:focus,textarea:focus{
  border-color:var(--primary);
  box-shadow:0 0 30px rgba(108,92,231,0.08);
}

table{width:100%;border-collapse:collapse}
th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:1px;font-weight:700}
tr:hover{background:var(--panel)}
.pill{
  padding:2px 10px;
  border-radius:20px;
  background:rgba(108,92,231,0.12);
  font-size:10px;
  font-weight:600;
  border:1px solid rgba(108,92,231,0.08);
}
.tag{
  display:inline-block;
  padding:1px 6px;
  border-radius:10px;
  font-size:9px;
  font-weight:600;
  margin:1px 2px;
}

.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.7);
  backdrop-filter:blur(20px);
  display:grid;
  place-items:center;
  z-index:10;
  padding:20px;
  animation:fadeIn 0.3s ease;
}
@keyframes fadeIn{
  from{opacity:0}
  to{opacity:1}
}
.modal{
  width:min(600px,100%);
  max-height:85vh;
  overflow:auto;
  background:var(--bg2);
  backdrop-filter:blur(30px);
  border:1px solid var(--line);
  border-radius:24px;
  padding:24px;
  box-shadow:0 50px 100px -20px rgba(0,0,0,0.5);
  animation:slideUp 0.3s ease;
}
.modal h2{font-size:20px;font-weight:800;margin-top:0}
.close{
  float:right;
  background:none;
  color:var(--muted);
  font-size:24px;
  transition:var(--transition);
  padding:4px 8px;
}
.close:active{transform:scale(0.8)}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.full{grid-column:1/-1}

.progress{
  height:5px;
  background:var(--line);
  border-radius:10px;
  overflow:hidden;
  margin-top:5px;
}
.progress-bar{
  height:100%;
  background:linear-gradient(90deg,var(--primary),var(--cyan));
  border-radius:10px;
  transition:width 0.6s ease;
}

.badge{
  display:inline-block;
  padding:2px 8px;
  border-radius:20px;
  font-size:9px;
  font-weight:700;
  text-transform:uppercase;
}
.badge-success{background:rgba(0,184,148,0.2);color:var(--green)}
.badge-danger{background:rgba(253,121,168,0.2);color:var(--red)}
.badge-warning{background:rgba(253,203,110,0.2);color:var(--orange)}
.badge-info{background:rgba(0,206,201,0.2);color:var(--cyan)}

.account-icon{
  width:44px;
  height:44px;
  border-radius:12px;
  display:grid;
  place-items:center;
  font-size:20px;
  flex-shrink:0;
}
.account-icon.cash{background:rgba(0,184,148,0.2);color:#00b894}
.account-icon.binance{background:rgba(253,203,110,0.2);color:#fdcb6e}
.account-icon.esewa{background:rgba(108,92,231,0.2);color:#6c5ce7}
.account-icon.khalti{background:rgba(253,121,168,0.2);color:#fd79a8}
.account-icon.mypay{background:rgba(0,206,201,0.2);color:#00cec9}
.account-icon.bank{background:rgba(162,155,254,0.2);color:#a29bfe}

.toast{
  position:fixed;
  bottom:24px;
  left:50%;
  transform:translateX(-50%) translateY(100px);
  background:var(--bg2);
  backdrop-filter:blur(30px);
  padding:14px 24px;
  border-radius:16px;
  z-index:20;
  box-shadow:0 20px 60px rgba(0,0,0,0.4);
  border:1px solid var(--line);
  font-weight:600;
  font-size:14px;
  transition:transform 0.4s cubic-bezier(0.4,0,0.2,1);
  max-width:90%;
  text-align:center;
  pointer-events:none;
}
.toast.show{
  transform:translateX(-50%) translateY(0);
}

.mobile-nav{display:none}

/* ====== RESPONSIVE ====== */
@media(max-width:1200px){
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
}

@media(max-width:992px){
  .sidebar{width:220px}
  .main{margin-left:220px;width:calc(100% - 220px)}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
}

@media(max-width:768px){
  .sidebar{display:none}
  .main{margin:0;width:100%;padding:12px;padding-bottom:80px}
  .cards{grid-template-columns:1fr}
  .two{grid-template-columns:1fr}
  .three{grid-template-columns:1fr}
  .title{font-size:20px}
  header{padding:12px 14px}
  .header-right{gap:8px}
  .theme-toggle{width:36px;height:36px;font-size:16px}
  .profile-avatar{width:38px;height:38px}
  .profile-avatar .avatar-text{font-size:15px}
  .profile-name{font-size:13px}
  .profile-actions button{font-size:9px;padding:1px 8px}
  .auth-container{padding:28px 20px}
  .auth-container .brand{font-size:24px}
  
  .mobile-nav{
    display:flex;
    position:fixed;
    bottom:0;
    inset-inline:0;
    background:var(--bg);
    backdrop-filter:blur(20px);
    border-top:1px solid var(--line);
    z-index:5;
    justify-content:space-around;
    padding:6px 4px;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .mobile-nav button{
    background:none;
    color:var(--muted);
    font-size:9px;
    font-weight:600;
    padding:4px 8px;
    border-radius:8px;
    text-align:center;
    touch-action:manipulation;
    min-width:44px;
  }
  .mobile-nav button:active{transform:scale(0.9)}
  .mobile-nav button.active{
    color:var(--text);
    background:rgba(108,92,231,0.12);
  }
  .mobile-nav button span{display:block;font-size:16px}
  
  .formgrid{grid-template-columns:1fr}
  table thead{display:none}
  table,tbody,tr,td{display:block;width:100%}
  tr{
    border:1px solid var(--line);
    border-radius:12px;
    padding:10px;
    margin-bottom:10px;
    background:var(--panel);
  }
  td{border:0;padding:4px 2px}
  td:before{content:attr(data-label);color:var(--muted);margin-right:8px;font-weight:600}
  .toolbar input,.toolbar select{min-width:80px;flex:1}
  .modal{padding:16px}
}

@media(max-width:480px){
  .auth-container{padding:20px 16px;border-radius:20px}
  .auth-container .brand{font-size:20px}
  .auth-container .auth-btn{padding:14px;font-size:14px}
  .auth-container .form-group input{padding:12px 14px;font-size:14px}
  .card{padding:14px}
  .stat .amount{font-size:20px}
  .btn{padding:10px 16px;font-size:12px;min-height:40px}
  .btn-small{padding:4px 10px;font-size:10px;min-height:28px}
}
</style>
</head>
<body>

<!-- ====== TOAST ====== -->
<div class="toast" id="toast"></div>

<!-- ====== AUTH PAGE (Register) ====== -->
<div id="authPage" class="auth-page">
  <div class="auth-container">
    <div class="brand">MR ELON <span>ALI</span></div>
    <div class="subtitle">💎 Create your account to start managing finances</div>
    
    <div id="authForm">
      <div class="form-group">
        <label>👤 Username</label>
        <input type="text" id="regUsername" placeholder="Choose a username" required minlength="3">
      </div>
      <div class="form-group">
        <label>🔑 Password</label>
        <input type="password" id="regPassword" placeholder="Create a password" required minlength="4">
      </div>
      <div class="form-group">
        <label>✅ Confirm Password</label>
        <input type="password" id="regConfirmPassword" placeholder="Confirm your password" required minlength="4">
      </div>
      <button class="auth-btn" id="registerBtn" onclick="handleRegister(event)">
        ✨ Create Account
      </button>
      <div class="switch-link">
        Already have an account? <a onclick="switchToLogin()">Sign in →</a>
      </div>
    </div>
  </div>
</div>

<!-- ====== LOGIN PAGE (Hidden) ====== -->
<div id="loginPage" class="auth-page" style="display:none">
  <div class="auth-container">
    <div class="brand">MR ELON <span>ALI</span></div>
    <div class="subtitle">🔐 Welcome back! Sign in to continue</div>
    
    <div id="loginForm">
      <div class="form-group">
        <label>👤 Username</label>
        <input type="text" id="loginUsername" placeholder="Enter your username" required>
      </div>
      <div class="form-group">
        <label>🔑 Password</label>
        <input type="password" id="loginPassword" placeholder="Enter your password" required minlength="4">
      </div>
      <button class="auth-btn" id="loginBtn" onclick="handleLogin(event)">
        🚀 Sign In
      </button>
      <div class="switch-link">
        Don't have an account? <a onclick="switchToRegister()">Create one →</a>
      </div>
    </div>
  </div>
</div>

<!-- ====== APP SECTION (DASHBOARD) ====== -->
<div id="appSection" class="app hidden">
  <aside class="sidebar">
    <div class="brand">MR ELON <span>ALI</span></div>
    <nav id="nav"></nav>
    <button class="btn btn-secondary" style="width:100%;margin-top:20px" onclick="logout()">🚪 Logout</button>
  </aside>

  <main class="main">
    <header>
      <div class="header-left">
        <div class="eyebrow">💼 Ultimate Dashboard</div>
        <div id="pageTitle" class="title">Overview</div>
      </div>
      <div class="header-right">
        <button class="theme-toggle" onclick="toggleTheme()" title="Toggle Theme">🌓</button>
        <div class="profile">
          <div class="profile-info">
            <div class="profile-name" id="userName"></div>
            <div class="profile-actions">
              <button onclick="document.getElementById('profilePicInput').click()">📷</button>
              <button onclick="deleteProfilePic()">🗑</button>
            </div>
          </div>
          <div class="profile-avatar" id="avatarContainer" onclick="document.getElementById('profilePicInput').click()">
            <span class="avatar-text" id="avatarText">M</span>
            <img id="profilePicImg" style="display:none" alt="Profile">
          </div>
          <input type="file" id="profilePicInput" accept="image/*" onchange="uploadProfilePic(event)">
        </div>
      </div>
    </header>
    <section id="content"></section>
  </main>

  <div class="mobile-nav" id="mobileNav"></div>
</div>

<div id="modalRoot"></div>

<script>
// ====== CONFIG ======
const KEY='mra_users', SESSION='mra_session';
const accounts=['Cash','Binance','eSewa','Khalti','MyPay','Bank'];
const categories=['Food','Transport','Shopping','Entertainment','Bills','Education','Health','Investment','Salary','Business','Other'];
const navItems=[
  ['dashboard','📊','Dashboard'],
  ['transactions','📝','Transactions'],
  ['budget','💰','Budget'],
  ['goals','🎯','Goals'],
  ['recurring','🔄','Recurring'],
  ['accounts','🏦','Accounts'],
  ['ledger','📒','Ledger'],
  ['investments','📈','Investments'],
  ['networth','💎','Net Worth'],
  ['reports','📋','Reports'],
  ['settings','⚙️','Settings']
];
let page='dashboard', theme='dark';

// ====== HELPERS ======
const $=s=>document.querySelector(s);
const money=n=>{let c=current()?.settings?.currency||'NPR';return (c==='NPR'?'Rs. ':'')+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})};
const today=()=>new Date().toISOString().slice(0,10);
const getMonth=()=>today().slice(0,7);
const users=()=>JSON.parse(localStorage.getItem(KEY)||'{}');
const current=()=>{let id=localStorage.getItem(SESSION);return id&&users()[id]};
const saveUser=(u)=>{let x=users();x[u.id]=u;localStorage.setItem(KEY,JSON.stringify(x))};
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random();
const blank=(id,name)=>({
  id,name,password:'',profilePic:null,transactions:[],budgets:[],goals:[],
  recurring:[],ledger:[],investments:[],networth:{assets:{},liabilities:{},history:[]},
  adjustments:{},settings:{currency:'NPR',theme:'dark',notifications:true}
});
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));

// ====== TOAST ======
function showToast(msg,type='success'){
  const t=$('#toast');
  t.textContent=msg;
  t.style.borderColor=type==='success'?'rgba(0,206,201,0.3)':type==='error'?'rgba(253,121,168,0.3)':'rgba(108,92,231,0.3)';
  t.className='toast show';
  clearTimeout(t._hide);
  t._hide=setTimeout(()=>t.className='toast',3000);
}

// ====== SWITCH PAGES ======
function switchToLogin(){
  document.getElementById('authPage').style.display='none';
  document.getElementById('loginPage').style.display='flex';
}
function switchToRegister(){
  document.getElementById('loginPage').style.display='none';
  document.getElementById('authPage').style.display='flex';
}

// ====== HANDLE REGISTER ======
function handleRegister(e){
  e.preventDefault();
  const username=document.getElementById('regUsername').value.trim();
  const password=document.getElementById('regPassword').value;
  const confirm=document.getElementById('regConfirmPassword').value;
  const btn=document.getElementById('registerBtn');
  
  if(username.length<3){showToast('❌ Username must be at least 3 characters','error');return;}
  if(password.length<4){showToast('❌ Password must be at least 4 characters','error');return;}
  if(password!==confirm){showToast('❌ Passwords do not match!','error');return;}
  
  btn.textContent='⏳ Creating...';
  btn.disabled=true;
  
  setTimeout(()=>{
    const usersData=users();
    if(usersData[username]){
      showToast('❌ Username already exists!','error');
      btn.textContent='✨ Create Account';
      btn.disabled=false;
      return;
    }
    const newUser=blank(username,username);
    newUser.password=password;
    usersData[username]=newUser;
    localStorage.setItem(KEY,JSON.stringify(usersData));
    localStorage.setItem(SESSION,username);
    showToast('🎉 Account created successfully!','success');
    setTimeout(()=>window.location.reload(),800);
  },800);
}

// ====== HANDLE LOGIN ======
function handleLogin(e){
  e.preventDefault();
  const username=document.getElementById('loginUsername').value.trim();
  const password=document.getElementById('loginPassword').value;
  const btn=document.getElementById('loginBtn');
  
  btn.textContent='⏳ Signing in...';
  btn.disabled=true;
  
  setTimeout(()=>{
    const usersData=users();
    if(usersData[username] && usersData[username].password===password){
      localStorage.setItem(SESSION,username);
      showToast('🎉 Welcome back, '+username+'!','success');
      setTimeout(()=>window.location.reload(),800);
    }else if(usersData[username]){
      showToast('❌ Incorrect password!','error');
      btn.textContent='🚀 Sign In';
      btn.disabled=false;
      document.getElementById('loginPassword').value='';
      document.getElementById('loginPassword').focus();
    }else{
      showToast('❌ User not found! Please register.','error');
      btn.textContent='🚀 Sign In';
      btn.disabled=false;
      setTimeout(switchToRegister,500);
    }
  },800);
}

// ====== LOGOUT ======
function logout(){
  if(confirm('Are you sure you want to logout?')){
    localStorage.removeItem(SESSION);
    window.location.reload();
  }
}

// ====== THEME ======
function toggleTheme(){
  theme=theme==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',theme);
  let u=current();if(u){u.settings.theme=theme;saveUser(u)}
}
function loadTheme(){
  let u=current();if(u&&u.settings.theme){theme=u.settings.theme;document.documentElement.setAttribute('data-theme',theme)}
}

// ====== PROFILE PICTURE ======
function loadProfilePic(){
  let u=current();if(!u)return;
  let img=$('#profilePicImg'),text=$('#avatarText'),container=$('#avatarContainer');
  if(u.profilePic){img.src=u.profilePic;img.style.display='block';text.style.display='none';container.style.background='transparent'}
  else{img.style.display='none';text.style.display='grid';text.textContent=(u.name||'M')[0].toUpperCase();container.style.background='linear-gradient(135deg,var(--primary),var(--cyan))'}
}
function uploadProfilePic(e){
  let file=e.target.files[0];if(!file)return;
  if(file.size>5*1024*1024)return showToast('❌ Image too large!','error');
  if(!file.type.startsWith('image/'))return showToast('❌ Not an image','error');
  let reader=new FileReader();
  reader.onload=function(e){let u=current();u.profilePic=e.target.result;saveUser(u);loadProfilePic();showToast('✅ Profile updated','success')};
  reader.readAsDataURL(file);e.target.value='';
}
function deleteProfilePic(){
  if(!confirm('Remove photo?'))return;
  let u=current();u.profilePic=null;saveUser(u);loadProfilePic();showToast('✅ Removed','success');
}

// ====== START DASHBOARD ======
function startDashboard(){
  document.getElementById('authPage').style.display='none';
  document.getElementById('loginPage').style.display='none';
  document.getElementById('appSection').classList.remove('hidden');
  loadTheme();
  drawNav();render();loadProfilePic();
}

// ====== NAV ======
function drawNav(){
  let h=navItems.map(x=>`<button class="${page===x[0]?'active':''}" onclick="page='${x[0]}';drawNav();render()">${x[1]} ${x[2]}</button>`).join('');
  $('#nav').innerHTML=h;
  $('#mobileNav').innerHTML=navItems.map(x=>`<button class="${page===x[0]?'active':''}" onclick="page='${x[0]}';drawNav();render()">${x[1]}<span>${x[2]}</span></button>`).join('');
}

// ====== CALCULATIONS ======
function calc(){
  let u=current(),tx=u.transactions;
  let income=tx.filter(x=>['Income','Received'].includes(x.type)).reduce((a,x)=>a+x.amount,0);
  let expense=tx.filter(x=>['Expense','Payment'].includes(x.type)).reduce((a,x)=>a+x.amount,0);
  let bal={Cash:0,Binance:0,eSewa:0,Khalti:0,MyPay:0,Bank:0};
  tx.forEach(x=>{let sign=['Income','Deposit','Received','Loan Taken'].includes(x.type)?1:-1;if(bal[x.account]!=null)bal[x.account]+=sign*x.amount});
  Object.keys(bal).forEach(k=>bal[k]+=+(u.adjustments[k]||0));
  let rec=u.ledger.filter(x=>x.kind==='receive'&&!x.paid).reduce((a,x)=>a+x.amount-x.partial,0);
  let pay=u.ledger.filter(x=>x.kind==='pay'&&!x.paid).reduce((a,x)=>a+x.amount-x.partial,0);
  let invTotal=u.investments.reduce((a,x)=>a+x.amount,0);
  let totalAssets=Object.values(bal).reduce((a,b)=>a+b,0)+invTotal+Object.values(u.networth?.assets||{}).reduce((a,b)=>a+b,0);
  let totalLiabilities=Object.values(u.networth?.liabilities||{}).reduce((a,b)=>a+b,0);
  return{income,expense,bal,total:Object.values(bal).reduce((a,b)=>a+b,0),rec,pay,invTotal,totalAssets,totalLiabilities,netWorth:totalAssets-totalLiabilities};
}

// ====== HEALTH SCORE ======
function healthScore(){
  let c=calc();let score=0;
  if(c.total>0)score+=15;
  if(c.income>c.expense)score+=20;
  if(c.rec>0)score+=10;
  if(c.invTotal>0)score+=15;
  if(c.total>100000)score+=10;
  if(c.income>50000)score+=10;
  if(c.netWorth>0)score+=20;
  return Math.min(100,score);
}

// ====== RENDER ======
function render(){
  let u=current();
  $('#userName').textContent='👤 '+u.name;
  loadProfilePic();
  $('#pageTitle').textContent=navItems.find(x=>x[0]===page)[2];
  let views={dashboard,transactions,budget,goals,recurring,accountsView,ledger,investments,networth,reports,settings};
  $('#content').innerHTML=views[page]?views[page]():'<div class="card"><h3>Page Coming Soon</h3></div>';
}

// ====== DASHBOARD ======
function dashboard(){
  let c=calc(),score=healthScore();
  let monthTx=current().transactions.filter(x=>x.date.startsWith(getMonth()));
  let monthIncome=monthTx.filter(x=>['Income','Received'].includes(x.type)).reduce((a,x)=>a+x.amount,0);
  let monthExpense=monthTx.filter(x=>['Expense','Payment'].includes(x.type)).reduce((a,x)=>a+x.amount,0);
  return `<div class="grid cards">
   <div class="card stat"><div class="icon">💰</div><div class="label">Total Balance</div><div class="amount">${money(c.total)}</div><div class="change positive">+${money(c.income-c.expense)} this month</div></div>
   <div class="card stat"><div class="icon">📈</div><div class="label">Monthly Income</div><div class="amount positive">${money(monthIncome)}</div></div>
   <div class="card stat"><div class="icon">📉</div><div class="label">Monthly Expenses</div><div class="amount negative">${money(monthExpense)}</div></div>
   <div class="card stat"><div class="icon">🏆</div><div class="label">Financial Health</div><div class="amount">${score}%</div><div class="progress"><div class="progress-bar" style="width:${score}%"></div></div></div>
   <div class="card stat"><div class="icon">💎</div><div class="label">Net Worth</div><div class="amount">${money(c.netWorth)}</div></div>
   <div class="card stat"><div class="icon">📥</div><div class="label">To Receive</div><div class="amount accent">${money(c.rec)}</div></div>
   <div class="card stat"><div class="icon">📤</div><div class="label">To Pay</div><div class="amount negative">${money(c.pay)}</div></div>
   <div class="card stat"><div class="icon">📈</div><div class="label">Investments</div><div class="amount accent">${money(c.invTotal)}</div></div>
  </div>
  <div class="grid two" style="margin-top:14px">
   <div class="card"><h3>⚡ Quick Actions</h3><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
    <button class="btn btn-glow btn-small" onclick="openTx()">➕ Transaction</button>
    <button class="btn btn-success btn-small" onclick="openBudget()">💰 Budget</button>
    <button class="btn btn-warning btn-small" onclick="openGoal()">🎯 Goal</button>
    <button class="btn btn-secondary btn-small" onclick="page='ledger';render()">📒 Ledger</button>
   </div></div>
   <div class="card"><h3>📊 Spending Breakdown</h3><div style="margin-top:10px">
    ${categories.slice(0,5).map(cat=>{let spent=current().transactions.filter(x=>x.category===cat&&x.type==='Expense').reduce((a,x)=>a+x.amount,0);return spent>0?`<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--line)"><span>${cat}</span><span class="negative">${money(spent)}</span></div>`:''}).join('')}
   </div></div>
  </div>
  <div class="card" style="margin-top:14px"><h3>📝 Recent Activity</h3>${txTable(current().transactions.slice(-5).reverse())}</div>`;
}

// ====== TRANSACTIONS TABLE ======
function txTable(a){
  if(!a.length)return'<div style="text-align:center;color:var(--muted);padding:30px">📭 No transactions</div>';
  return`<div style="overflow:auto"><table><thead><tr><th>📅 Date</th><th>📌 Type</th><th>🏦 Account</th><th>📂 Category</th><th>💰 Amount</th><th>🏷️ Tags</th><th></th></tr></thead><tbody>${a.map(x=>`<tr><td data-label="Date">${x.date}</td><td data-label="Type"><span class="pill">${esc(x.type)}</span></td><td data-label="Account">${esc(x.account)}</td><td data-label="Category"><span class="tag" style="background:rgba(108,92,231,0.15)">${esc(x.category||'-')}</span></td><td data-label="Amount" class="${['Income','Received','Deposit'].includes(x.type)?'positive':'negative'}">${money(x.amount)}</td><td data-label="Tags">${(x.tags||[]).map(t=>`<span class="tag" style="background:rgba(0,206,201,0.15)">#${t}</span>`).join('')}</td><td><button class="btn btn-danger btn-small" onclick="delTx('${x.id}')">🗑</button></td></tr>`).join('')}</tbody></table></div>`;
}

// ====== TRANSACTIONS PAGE ======
function transactions(){
  return`<div class="toolbar"><input id="q" placeholder="🔍 Search..." oninput="filterTx()" style="max-width:250px"><select id="tf" onchange="filterTx()" style="max-width:150px"><option value="">All Types</option>${['Income','Expense','Deposit','Withdrawal','Transfer','Received','Payment'].map(x=>`<option>${x}</option>`).join('')}</select><select id="cf" onchange="filterTx()" style="max-width:150px"><option value="">All Categories</option>${categories.map(x=>`<option>${x}</option>`).join('')}</select><button class="btn btn-glow" onclick="openTx()">➕ Add</button><button class="btn btn-secondary" onclick="exportCSV()">📥 Export</button></div><div class="card" id="txlist">${txTable(current().transactions.slice().reverse())}</div>`;
}
function filterTx(){let q=$('#q').value.toLowerCase(),t=$('#tf').value,c=$('#cf').value;let a=current().transactions.filter(x=>(!t||x.type===t)&&(!c||x.category===c)&&JSON.stringify(x).toLowerCase().includes(q));$('#txlist').innerHTML=txTable(a.reverse())}

// ====== ADD TRANSACTION ======
function openTx(){
  modal(`<h2>➕ New Transaction</h2><form onsubmit="addTx(event)"><div class="formgrid"><div><label style="color:var(--muted);font-size:12px;font-weight:600">📌 Type</label><select id="tt">${['Income','Expense','Deposit','Withdrawal','Transfer','Received','Payment'].map(x=>`<option>${x}</option>`).join('')}</select></div><div><label style="color:var(--muted);font-size:12px;font-weight:600">🏦 Account</label><select id="ta">${accounts.map(x=>`<option>${x}</option>`).join('')}</select></div><div><label style="color:var(--muted);font-size:12px;font-weight:600">💰 Amount</label><input id="am" type="number" min=".01" step=".01" required></div><div><label style="color:var(--muted);font-size:12px;font-weight:600">📅 Date</label><input id="dt" type="date" value="${today()}" required></div><div><label style="color:var(--muted);font-size:12px;font-weight:600">📂 Category</label><select id="cat">${categories.map(x=>`<option>${x}</option>`).join('')}</select></div><div><label style="color:var(--muted);font-size:12px;font-weight:600">🏷️ Tags (comma)</label><input id="tags" placeholder="food, urgent"></div><div class="full"><label style="color:var(--muted);font-size:12px;font-weight:600">📝 Description</label><textarea id="desc"></textarea></div></div><button class="btn btn-glow" style="width:100%;margin-top:14px;padding:14px">💾 Save</button></form>`);
}
function addTx(e){e.preventDefault();let u=current();u.transactions.push({id:uid(),type:$('#tt').value,account:$('#ta').value,amount:+$('#am').value,date:$('#dt').value,time:new Date().toLocaleTimeString(),category:$('#cat').value,tags:$('#tags').value.split(',').map(s=>s.trim()).filter(Boolean),description:$('#desc').value});saveUser(u);closeModal();render();showToast('✅ Saved','success')}
function delTx(id){if(!confirm('Delete?'))return;let u=current();u.transactions=u.transactions.filter(x=>x.id!==id);saveUser(u);render();showToast('🗑 Deleted','success')}

// ====== BUDGET ======
function budget(){let u=current();return`<div class="toolbar"><button class="btn btn-glow" onclick="openBudget()">💰 Add Budget</button></div><div class="grid two">${u.budgets.length?u.budgets.map(b=>{let spent=u.transactions.filter(x=>x.category===b.category&&x.type==='Expense'&&x.date.startsWith(b.month)).reduce((a,x)=>a+x.amount,0);let pct=Math.min(100,(spent/b.amount)*100);return`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">${b.category}</h3><span class="badge ${spent>b.amount?'badge-danger':'badge-success'}">${pct.toFixed(0)}%</span></div><div style="font-size:20px;font-weight:700;margin:6px 0">${money(spent)} / ${money(b.amount)}</div><div class="progress"><div class="progress-bar" style="width:${pct}%"></div></div><div style="margin-top:6px;font-size:12px;color:var(--muted)">${b.month} · ${b.note||''}</div><button class="btn btn-danger btn-small" style="margin-top:8px" onclick="delBudget('${b.id}')">🗑 Delete</button></div>`}).join(''):'<div style="text-align:center;color:var(--muted);padding:40px;grid-column:1/-1">📭 No budgets set</div>'}</div>`;}
function openBudget(){modal(`<h2>💰 Set Budget</h2><form onsubmit="addBudget(event)"><label style="color:var(--muted);font-size:12px;font-weight:600">📂 Category</label><select id="bc">${categories.map(x=>`<option>${x}</option>`).join('')}</select><label style="color:var(--muted);font-size:12px;font-weight:600">💰 Amount</label><input id="ba" type="number" min=".01" step=".01" required><label style="color:var(--muted);font-size:12px;font-weight:600">📅 Month</label><input id="bm" type="month" value="${getMonth()}" required><label style="color:var(--muted);font-size:12px;font-weight:600">📝 Note</label><input id="bn"><button class="btn btn-glow" style="width:100%;margin-top:12px;padding:14px">💾 Save Budget</button></form>`);}
function addBudget(e){e.preventDefault();let u=current();u.budgets.push({id:uid(),category:$('#bc').value,amount:+$('#ba').value,month:$('#bm').value,note:$('#bn').value});saveUser(u);closeModal();render();showToast('✅ Budget saved','success')}
function delBudget(id){if(!confirm('Delete budget?'))return;let u=current();u.budgets=u.budgets.filter(x=>x.id!==id);saveUser(u);render();showToast('🗑 Deleted','success')}

// ====== GOALS ======
function goals(){let u=current();return`<div class="toolbar"><button class="btn btn-glow" onclick="openGoal()">🎯 Add Goal</button></div><div class="grid three">${u.goals.length?u.goals.map(g=>{let saved=u.transactions.filter(x=>x.category===g.category&&x.type==='Income'&&x.date>=g.startDate&&x.date<=g.targetDate).reduce((a,x)=>a+x.amount,0);let pct=Math.min(100,(saved/g.target)*100);return`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">${g.name}</h3><span class="badge ${pct>=100?'badge-success':'badge-info'}">${pct.toFixed(0)}%</span></div><div style="font-size:20px;font-weight:700;margin:6px 0">${money(saved)} / ${money(g.target)}</div><div class="progress"><div class="progress-bar" style="width:${pct}%"></div></div><div style="margin-top:6px;font-size:12px;color:var(--muted)">📅 ${g.targetDate} · ${g.category}</div><button class="btn btn-danger btn-small" style="margin-top:8px" onclick="delGoal('${g.id}')">🗑 Delete</button></div>`}).join(''):'<div style="text-align:center;color:var(--muted);padding:40px;grid-column:1/-1">📭 No goals set</div>'}</div>`;}
function openGoal(){modal(`<h2>🎯 Set Goal</h2><form onsubmit="addGoal(event)"><label style="color:var(--muted);font-size:12px;font-weight:600">🎯 Goal Name</label><input id="gn" required placeholder="e.g. Save for vacation"><label style="color:var(--muted);font-size:12px;font-weight:600">💰 Target Amount</label><input id="gt" type="number" min=".01" step=".01" required><label style="color:var(--muted);font-size:12px;font-weight:600">📂 Category</label><select id="gc">${categories.map(x=>`<option>${x}</option>`).join('')}</select><label style="color:var(--muted);font-size:12px;font-weight:600">📅 Target Date</label><input id="gd" type="date" required><label style="color:var(--muted);font-size:12px;font-weight:600">📝 Description</label><input id="gdesc"><button class="btn btn-glow" style="width:100%;margin-top:12px;padding:14px">💾 Save Goal</button></form>`);}
function addGoal(e){e.preventDefault();let u=current();u.goals.push({id:uid(),name:$('#gn').value,target:+$('#gt').value,category:$('#gc').value,startDate:today(),targetDate:$('#gd').value,description:$('#gdesc').value});saveUser(u);closeModal();render();showToast('✅ Goal saved','success')}
function delGoal(id){if(!confirm('Delete goal?'))return;let u=current();u.goals=u.goals.filter(x=>x.id!==id);saveUser(u);render();showToast('🗑 Deleted','success')}

// ====== RECURRING ======
function recurring(){let u=current();return`<div class="toolbar"><button class="btn btn-glow" onclick="openRecurring()">🔄 Add Recurring</button></div><div class="grid two">${u.recurring&&u.recurring.length?u.recurring.map(r=>`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">${r.name}</h3><span class="badge ${r.type==='Income'?'badge-success':'badge-danger'}">${r.frequency}</span></div><div style="font-size:20px;font-weight:700;margin:6px 0" class="${r.type==='Income'?'positive':'negative'}">${money(r.amount)}</div><div style="font-size:12px;color:var(--muted)">📅 Next: ${r.nextDate} · ${r.category}</div><div style="margin-top:8px"><button class="btn btn-success btn-small" onclick="processRecurring('${r.id}')">✅ Process</button><button class="btn btn-danger btn-small" onclick="deleteRecurring('${r.id}')">🗑</button></div></div>`).join(''):'<div style="text-align:center;color:var(--muted);padding:40px;grid-column:1/-1">📭 No recurring transactions</div>'}</div>`;}
function openRecurring(){modal(`<h2>🔄 Recurring Transaction</h2><form onsubmit="addRecurring(event)"><label style="color:var(--muted);font-size:12px;font-weight:600">📌 Name</label><input id="rn" required placeholder="e.g. Rent"><label style="color:var(--muted);font-size:12px;font-weight:600">💰 Amount</label><input id="ra" type="number" min=".01" step=".01" required><label style="color:var(--muted);font-size:12px;font-weight:600">📌 Type</label><select id="rt"><option>Income</option><option>Expense</option></select><label style="color:var(--muted);font-size:12px;font-weight:600">🏦 Account</label><select id="racc">${accounts.map(x=>`<option>${x}</option>`).join('')}</select><label style="color:var(--muted);font-size:12px;font-weight:600">📂 Category</label><select id="rcat">${categories.map(x=>`<option>${x}</option>`).join('')}</select><label style="color:var(--muted);font-size:12px;font-weight:600">🔄 Frequency</label><select id="rfreq"><option>monthly</option><option>weekly</option><option>yearly</option></select><label style="color:var(--muted);font-size:12px;font-weight:600">📅 Next Date</label><input id="rnext" type="date" value="${today()}"><button class="btn btn-glow" style="width:100%;margin-top:12px">💾 Save</button></form>`);}
function addRecurring(e){e.preventDefault();let u=current();if(!u.recurring)u.recurring=[];u.recurring.push({id:uid(),name:$('#rn').value,amount:+$('#ra').value,type:$('#rt').value,account:$('#racc').value,category:$('#rcat').value,frequency:$('#rfreq').value,nextDate:$('#rnext').value,active:true,created:today()});saveUser(u);closeModal();render();showToast('✅ Recurring added!','success')}
function processRecurring(id){let u=current();let rec=u.recurring.find(r=>r.id===id);if(!rec)return;u.transactions.push({id:uid(),type:rec.type,account:rec.account,amount:rec.amount,date:today(),time:new Date().toLocaleTimeString(),category:rec.category,tags:['recurring'],description:`Recurring: ${rec.name}`});let next=new Date(rec.nextDate);if(rec.frequency==='monthly')next.setMonth(next.getMonth()+1);else if(rec.frequency==='weekly')next.setDate(next.getDate()+7);else if(rec.frequency==='yearly')next.setFullYear(next.getFullYear()+1);rec.nextDate=next.toISOString().slice(0,10);saveUser(u);render();showToast('✅ Recurring processed!','success')}
function deleteRecurring(id){if(!confirm('Delete recurring?'))return;let u=current();u.recurring=u.recurring.filter(r=>r.id!==id);saveUser(u);render();showToast('🗑 Deleted','success')}

// ====== ACCOUNTS ======
function accountsView(){
  let u=current(),c=calc();
  let totalBal=c.total;
  let accountColors={'Cash':'cash','Binance':'binance','eSewa':'esewa','Khalti':'khalti','MyPay':'mypay','Bank':'bank'};
  return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px"><h2 style="margin:0;font-size:20px">🏦 All Accounts</h2><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-glow btn-small" onclick="adjustBalance()">⚙️ Adjust</button><button class="btn btn-secondary btn-small" onclick="exportAccounts()">📥 Export</button></div></div>
  <div class="grid cards"><div class="card stat"><div class="icon">💰</div><div class="label">Total Balance</div><div class="amount">${money(totalBal)}</div></div>
  <div class="card stat"><div class="icon">📊</div><div class="label">Highest Balance</div><div class="amount positive">${money(Math.max(...Object.values(c.bal)))}</div></div>
  <div class="card stat"><div class="icon">📈</div><div class="label">Average Balance</div><div class="amount">${money(totalBal/accounts.length)}</div></div>
  <div class="card stat"><div class="icon">🔄</div><div class="label">Total Transactions</div><div class="amount">${u.transactions.length}</div></div></div>
  <div class="grid two" style="margin-top:14px">${accounts.map(a=>{let bal=c.bal[a]||0;let txCount=u.transactions.filter(x=>x.account===a).length;let iconClass=accountColors[a]||'cash';let pct=totalBal>0?((bal/totalBal)*100).toFixed(1):0;return`<div class="card" style="padding:0;overflow:hidden"><div style="display:flex;align-items:center;padding:16px 16px 0 16px;gap:12px"><div class="account-icon ${iconClass}">${a==='Cash'?'💵':a==='Binance'?'🪙':a==='eSewa'?'📱':a==='Khalti'?'📱':a==='MyPay'?'📱':'🏛️'}</div><div style="flex:1"><h3 style="margin:0;font-size:14px">${a}</h3><div style="font-size:11px;color:var(--muted)">${txCount} transactions</div></div><div style="text-align:right"><div class="amount" style="font-size:18px;margin:0">${money(bal)}</div><div style="font-size:10px;color:var(--muted)">${pct}%</div></div></div><div class="progress" style="margin:10px 16px 0 16px;height:3px"><div class="progress-bar" style="width:${pct}%;background:${bal>=0?'linear-gradient(90deg,var(--primary),var(--cyan))':'linear-gradient(90deg,var(--red),var(--orange))'}"></div></div><div style="display:flex;gap:6px;padding:10px 16px;border-top:1px solid var(--line);margin-top:10px;flex-wrap:wrap"><button class="btn btn-small btn-success" onclick="quickAddTx('${a}','Income')">📈 Income</button><button class="btn btn-small btn-danger" onclick="quickAddTx('${a}','Expense')">📉 Expense</button><button class="btn btn-small btn-secondary" onclick="viewAccountTx('${a}')">📋 View</button></div></div>`}).join('')}</div>
  <div class="card" style="margin-top:14px"><h3>📊 Account Distribution</h3><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:10px">${accounts.map(a=>{let bal=c.bal[a]||0;let pct=totalBal>0?((bal/totalBal)*100).toFixed(1):0;return`<div style="text-align:center;padding:10px;background:var(--panel);border-radius:12px;border:1px solid var(--line)"><div style="font-size:18px">${a==='Cash'?'💵':a==='Binance'?'🪙':a==='eSewa'?'📱':a==='Khalti'?'📱':a==='MyPay'?'📱':'🏛️'}</div><div style="font-weight:700;font-size:13px;margin:4px 0">${money(bal)}</div><div style="font-size:10px;color:var(--muted)">${pct}%</div><div class="progress" style="height:2px;margin-top:4px"><div class="progress-bar" style="width:${pct}%"></div></div></div>`}).join('')}</div></div>`;
}

function quickAddTx(account,type){
  modal(`<h2>${type==='Income'?'📈 Add Income':'📉 Add Expense'} - ${account}</h2><form onsubmit="quickSaveTx(event,'${account}','${type}')"><label style="color:var(--muted);font-size:12px;font-weight:600">💰 Amount</label><input id="qamount" type="number" min=".01" step=".01" required><label style="color:var(--muted);font-size:12px;font-weight:600">📂 Category</label><select id="qcat">${categories.map(x=>`<option>${x}</option>`).join('')}</select><label style="color:var(--muted);font-size:12px;font-weight:600">📝 Description</label><input id="qdesc" placeholder="Optional"><button class="btn btn-glow" style="width:100%;margin-top:12px">💾 Save</button></form>`);
}
function quickSaveTx(e,account,type){e.preventDefault();let u=current();u.transactions.push({id:uid(),type:type,account:account,amount:+$('#qamount').value,date:today(),time:new Date().toLocaleTimeString(),category:$('#qcat').value,tags:[],description:$('#qdesc').value||''});saveUser(u);closeModal();render();showToast(`✅ ${type} added to ${account}`,'success')}
function viewAccountTx(account){page='transactions';drawNav();render();setTimeout(()=>{let txList=$('#txlist');if(txList){let rows=txList.querySelectorAll('tr');rows.forEach(row=>{let cells=row.querySelectorAll('td');if(cells.length>2){let accCell=cells[2];if(accCell && accCell.textContent.trim()!==account){row.style.display='none'}}});}showToast(`📋 Showing transactions for ${account}`,'info')},100)}
function adjustBalance(){modal(`<h2>⚙️ Adjust Account Balance</h2><form onsubmit="saveAdjustment(event)"><label style="color:var(--muted);font-size:12px;font-weight:600">🏦 Account</label><select id="adjacc">${accounts.map(x=>`<option>${x}</option>`).join('')}</select><label style="color:var(--muted);font-size:12px;font-weight:600">💰 New Balance Amount</label><input id="adjamt" type="number" step=".01" required placeholder="Enter new balance"><p style="color:var(--muted);font-size:11px;margin-top:8px">⚠️ This will override the current balance</p><button class="btn btn-glow" style="width:100%;margin-top:12px">💾 Save</button></form>`);}
function saveAdjustment(e){e.preventDefault();let u=current();let acc=$('#adjacc').value;let amt=+$('#adjamt').value;let c=calc();let currentBal=c.bal[acc]||0;let adjustment=amt-currentBal;u.adjustments[acc]=adjustment;saveUser(u);closeModal();render();showToast(`✅ ${acc} balance adjusted to ${money(amt)}`,'success')}
function exportAccounts(){let u=current(),c=calc();let report='MR ELON ALI - Account Report\n';report+='='.repeat(50)+'\n';report+=`Date: ${today()}\nUser: ${u.name}\n\n`;report+='Account\t\tBalance\t\tTransactions\n';report+='-'.repeat(50)+'\n';accounts.forEach(a=>{let bal=c.bal[a]||0;let tx=u.transactions.filter(x=>x.account===a).length;report+=`${a}\t\t${money(bal)}\t\t${tx}\n`;});report+='-'.repeat(50)+'\n';report+=`TOTAL\t\t${money(c.total)}\t\t${u.transactions.length}\n`;let blob=new Blob([report],{type:'text/plain'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`accounts-report-${today()}.txt`;a.click();showToast('✅ Accounts exported','success')}

// ====== LEDGER ======
function ledger(){let u=current(),q=u.ledger;return`<div class="toolbar"><button class="btn btn-glow" onclick="openLedger('receive')">📥 Receive</button><button class="btn btn-secondary" onclick="openLedger('pay')">📤 Pay</button></div><div class="grid two">${['receive','pay'].map(k=>{let a=q.filter(x=>x.kind===k),sum=a.reduce((s,x)=>s+x.amount-x.partial,0);return`<div class="card"><h3>${k==='receive'?'📥 To Receive':'📤 To Pay'} <span class="accent">${money(sum)}</span></h3>${a.length?a.map(x=>`<div style="border-top:1px solid var(--line);padding:10px 0"><b>👤 ${esc(x.person)}</b> — ${money(x.amount-x.partial)} left<br><small style="color:var(--muted)">📅 Due ${x.due||'—'}</small>${x.due&&x.due<today()&&!x.paid?' <span class="badge badge-danger">Overdue</span>':''}<br><button class="btn btn-success btn-small" onclick="partial('${x.id}')">➕ Pay</button><button class="btn btn-danger btn-small" onclick="delLedger('${x.id}')">🗑</button></div>`).join(''):'<div style="text-align:center;color:var(--muted);padding:30px">📭 Empty</div>'}</div>`}).join('')}</div>`;}
function openLedger(kind){modal(`<h2>${kind==='receive'?'📥 Receive':'📤 Pay'}</h2><form onsubmit="addLedger(event,'${kind}')"><label style="color:var(--muted);font-size:12px;font-weight:600">👤 Person</label><input id="lp" required><label style="color:var(--muted);font-size:12px;font-weight:600">💰 Amount</label><input id="la" type="number" min=".01" step=".01" required><label style="color:var(--muted);font-size:12px;font-weight:600">📅 Date</label><input id="ld" type="date" value="${today()}"><label style="color:var(--muted);font-size:12px;font-weight:600">📅 Due</label><input id="due" type="date"><label style="color:var(--muted);font-size:12px;font-weight:600">📝 Note</label><textarea id="ln"></textarea><button class="btn btn-glow" style="width:100%;margin-top:12px;padding:14px">💾 Save</button></form>`);}
function addLedger(e,k){e.preventDefault();let u=current();u.ledger.push({id:uid(),kind:k,person:$('#lp').value,amount:+$('#la').value,partial:0,date:$('#ld').value,due:$('#due').value,note:$('#ln').value,paid:false});saveUser(u);closeModal();render();showToast('✅ Saved','success')}
function partial(id){let u=current(),x=u.ledger.find(a=>a.id===id),v=+prompt('💵 Payment amount',x.amount-x.partial);if(!v||v<0)return;x.partial=Math.min(x.amount,x.partial+v);x.paid=x.partial>=x.amount;saveUser(u);render()}
function delLedger(id){if(confirm('Delete?')){let u=current();u.ledger=u.ledger.filter(x=>x.id!==id);saveUser(u);render();showToast('🗑 Deleted','success')}}

// ====== INVESTMENTS ======
function investments(){let u=current();return`<div class="toolbar"><button class="btn btn-glow" onclick="openInvestment()">📈 Add Investment</button></div><div class="grid two">${u.investments.length?u.investments.map(inv=>`<div class="card"><div style="display:flex;justify-content:space-between"><h3 style="margin:0">${inv.name}</h3><span class="badge ${inv.type==='Stock'?'badge-info':inv.type==='Crypto'?'badge-warning':'badge-success'}">${inv.type}</span></div><div style="font-size:18px;font-weight:700;margin:6px 0">${money(inv.amount)}</div><div style="font-size:11px;color:var(--muted)">📅 ${inv.date} · ${inv.note||''}</div><button class="btn btn-danger btn-small" style="margin-top:6px" onclick="delInvestment('${inv.id}')">🗑 Delete</button></div>`).join(''):'<div style="text-align:center;color:var(--muted);padding:40px;grid-column:1/-1">📭 No investments</div>'}</div>`;}
function openInvestment(){modal(`<h2>📈 Add Investment</h2><form onsubmit="addInvestment(event)"><label style="color:var(--muted);font-size:12px;font-weight:600">📈 Name</label><input id="in" required placeholder="e.g. Tesla Stock"><label style="color:var(--muted);font-size:12px;font-weight:600">💰 Amount</label><input id="ia" type="number" min=".01" step=".01" required><label style="color:var(--muted);font-size:12px;font-weight:600">📂 Type</label><select id="itype"><option>Stock</option><option>Crypto</option><option>Real Estate</option><option>Business</option><option>Other</option></select><label style="color:var(--muted);font-size:12px;font-weight:600">📅 Date</label><input id="idate" type="date" value="${today()}"><label style="color:var(--muted);font-size:12px;font-weight:600">📝 Note</label><input id="inote"><button class="btn btn-glow" style="width:100%;margin-top:12px;padding:14px">💾 Save</button></form>`);}
function addInvestment(e){e.preventDefault();let u=current();u.investments.push({id:uid(),name:$('#in').value,amount:+$('#ia').value,type:$('#itype').value,date:$('#idate').value,note:$('#inote').value});saveUser(u);closeModal();render();showToast('✅ Investment saved','success')}
function delInvestment(id){if(!confirm('Delete?'))return;let u=current();u.investments=u.investments.filter(x=>x.id!==id);saveUser(u);render();showToast('🗑 Deleted','success')}

// ====== NET WORTH ======
function networth(){let u=current(),c=calc();let assets=u.networth?.assets||{};let liabilities=u.networth?.liabilities||{};let totalAssets=Object.values(assets).reduce((a,b)=>a+b,0)+c.total+c.invTotal;let totalLiabilities=Object.values(liabilities).reduce((a,b)=>a+b,0);let netWorth=totalAssets-totalLiabilities;return`<div class="grid cards"><div class="card stat"><div class="icon">📈</div><div class="label">Total Assets</div><div class="amount positive">${money(totalAssets)}</div></div><div class="card stat"><div class="icon">📉</div><div class="label">Total Liabilities</div><div class="amount negative">${money(totalLiabilities)}</div></div><div class="card stat"><div class="icon">💎</div><div class="label">Net Worth</div><div class="amount ${netWorth>=0?'positive':'negative'}">${money(netWorth)}</div></div><div class="card stat"><div class="icon">🏦</div><div class="label">Cash + Investments</div><div class="amount">${money(c.total+c.invTotal)}</div></div></div><div class="grid two" style="margin-top:14px"><div class="card"><h3>📈 Assets</h3><form onsubmit="addAsset(event)" style="display:flex;gap:8px;flex-wrap:wrap"><input id="assetName" placeholder="Asset Name" style="flex:1;min-width:100px"><input id="assetValue" type="number" placeholder="Value" style="max-width:120px"><button class="btn btn-small">➕ Add</button></form>${Object.entries(assets).map(([name,value])=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)"><span>${name}</span><span class="positive">${money(value)}</span><button class="btn btn-danger btn-small" onclick="removeAsset('${name}')">🗑</button></div>`).join('')}</div><div class="card"><h3>📉 Liabilities</h3><form onsubmit="addLiability(event)" style="display:flex;gap:8px;flex-wrap:wrap"><input id="liabName" placeholder="Liability Name" style="flex:1;min-width:100px"><input id="liabValue" type="number" placeholder="Value" style="max-width:120px"><button class="btn btn-small">➕ Add</button></form>${Object.entries(liabilities).map(([name,value])=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)"><span>${name}</span><span class="negative">${money(value)}</span><button class="btn btn-danger btn-small" onclick="removeLiability('${name}')">🗑</button></div>`).join('')}</div></div>`;}
function addAsset(e){e.preventDefault();let u=current();if(!u.networth)u.networth={assets:{},liabilities:{},history:[]};u.networth.assets[$('#assetName').value]=+$('#assetValue').value;saveUser(u);render();showToast('✅ Asset added','success')}
function addLiability(e){e.preventDefault();let u=current();if(!u.networth)u.networth={assets:{},liabilities:{},history:[]};u.networth.liabilities[$('#liabName').value]=+$('#liabValue').value;saveUser(u);render();showToast('✅ Liability added','success')}
function removeAsset(name){if(!confirm('Remove asset?'))return;let u=current();delete u.networth.assets[name];saveUser(u);render();showToast('🗑 Removed','success')}
function removeLiability(name){if(!confirm('Remove liability?'))return;let u=current();delete u.networth.liabilities[name];saveUser(u);render();showToast('🗑 Removed','success')}

// ====== REPORTS ======
function reports(){let c=calc();let monthly={};current().transactions.forEach(x=>{let m=x.date.slice(0,7);if(!monthly[m])monthly[m]={income:0,expense:0};if(['Income','Received'].includes(x.type))monthly[m].income+=x.amount;else monthly[m].expense+=x.amount;});let months=Object.keys(monthly).sort();return`<div class="grid cards"><div class="card stat"><div class="icon">📈</div><div class="label">Total Income</div><div class="amount positive">${money(c.income)}</div></div><div class="card stat"><div class="icon">📉</div><div class="label">Total Expenses</div><div class="amount negative">${money(c.expense)}</div></div><div class="card stat"><div class="icon">📊</div><div class="label">Net P/L</div><div class="amount">${money(c.income-c.expense)}</div></div><div class="card stat"><div class="icon">💎</div><div class="label">Net Worth</div><div class="amount">${money(c.netWorth)}</div></div></div><div class="card" style="margin-top:14px"><h3>📊 Monthly Summary</h3>${months.length?`<div style="overflow:auto;margin-top:10px"><table><thead><tr><th>Month</th><th>Income</th><th>Expense</th><th>Profit</th></tr></thead><tbody>${months.map(m=>{let d=monthly[m];return`<tr><td>${m}</td><td class="positive">${money(d.income)}</td><td class="negative">${money(d.expense)}</td><td class="${d.income>d.expense?'positive':'negative'}">${money(d.income-d.expense)}</td></tr>`}).join('')}</tbody></table></div>`:'<div style="text-align:center;color:var(--muted);padding:20px">No data</div>'}</div><div class="grid two" style="margin-top:14px"><div class="card"><h3>📊 Category Breakdown</h3>${categories.map(cat=>{let spent=current().transactions.filter(x=>x.category===cat&&x.type==='Expense').reduce((a,x)=>a+x.amount,0);return spent>0?`<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--line)"><span>${cat}</span><span class="negative">${money(spent)}</span></div>`:''}).join('')}</div><div class="card"><h3>🏷️ Tag Analysis</h3>${(()=>{let tags={};current().transactions.forEach(x=>(x.tags||[]).forEach(t=>{tags[t]=(tags[t]||0)+x.amount}));return Object.entries(tags).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([tag,amt])=>`<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--line)"><span>#${tag}</span><span>${money(amt)}</span></div>`).join('')||'<div style="color:var(--muted);padding:10px">No tags used</div>';})()}</div></div>`;}

// ====== SETTINGS ======
function settings(){let s=current().settings;return`<div class="card"><h3>⚙️ Settings</h3><form onsubmit="saveSettings(event)"><label style="color:var(--muted);font-size:12px;font-weight:600">👤 Display Name</label><input id="sn" value="${esc(current().name)}"><label style="color:var(--muted);font-size:12px;font-weight:600">💱 Currency</label><select id="sc"><option ${s.currency==='NPR'?'selected':''}>NPR</option><option ${s.currency==='USD'?'selected':''}>USD</option><option ${s.currency==='EUR'?'selected':''}>EUR</option></select><label style="color:var(--muted);font-size:12px;font-weight:600">🌓 Theme</label><select id="st"><option ${s.theme==='dark'?'selected':''}>dark</option><option ${s.theme==='light'?'selected':''}>light</option></select><label><input id="notif" type="checkbox" style="width:auto;margin-right:6px" ${s.notifications?'checked':''}> 🔔 Notifications</label><button class="btn btn-glow" style="width:100%;margin-top:12px;padding:14px">💾 Save</button></form><hr style="border-color:var(--line);margin:14px 0"><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-secondary btn-small" onclick="exportJSON()">📥 Export</button><button class="btn btn-secondary btn-small" onclick="importJSON()">📤 Import</button><button class="btn btn-success btn-small" onclick="generatePDF()">📄 PDF</button><button class="btn btn-danger btn-small" onclick="resetData()">🗑 Reset</button></div><p style="color:var(--muted);font-size:10px;margin-top:12px">⚠️ Never enter real credentials</p></div>`;}
function saveSettings(e){e.preventDefault();let u=current();u.name=$('#sn').value||u.id;u.settings.currency=$('#sc').value;u.settings.theme=$('#st').value;u.settings.notifications=$('#notif').checked;saveUser(u);theme=$('#st').value;document.documentElement.setAttribute('data-theme',theme);render();showToast('✅ Saved','success')}
function exportJSON(){let b=new Blob([JSON.stringify(current(),null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mr-elon-ali-backup.json';a.click();showToast('✅ Exported','success')}
function importJSON(){let input=document.createElement('input');input.type='file';input.accept='.json';input.onchange=function(e){let file=e.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=function(e){try{let data=JSON.parse(e.target.result);let u=current();Object.assign(u,data);saveUser(u);render();showToast('✅ Imported','success')}catch(err){showToast('❌ Invalid file','error')}};reader.readAsText(file)};input.click()}
function resetData(){if(confirm('⚠️ Delete all data?')){let u=blank(current().id,current().name);u.password=current().password;saveUser(u);render();showToast('🗑 Reset','success')}}
function generatePDF(){let u=current(),c=calc();let html=`<html><head><title>MR ELON ALI - Financial Report</title><style>body{font-family:Arial,sans-serif;padding:40px;color:#333}h1{color:#6c5ce7;border-bottom:2px solid #6c5ce7;padding-bottom:10px}.section{margin:20px 0;padding:20px;border:1px solid #ddd;border-radius:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.stat{padding:15px;background:#f8f9fa;border-radius:10px}.amount{font-size:24px;font-weight:bold}.positive{color:#00b894}.negative{color:#fd79a8}table{width:100%;border-collapse:collapse}th,td{padding:8px;text-align:left;border-bottom:1px solid #ddd}th{background:#f8f9fa}.footer{margin-top:40px;text-align:center;color:#999;font-size:12px}</style></head><body><h1>📊 MR ELON ALI - Financial Report</h1><p>Generated: ${new Date().toLocaleString()} | User: ${u.name}</p><div class="section"><h2>💰 Summary</h2><div class="grid"><div class="stat"><strong>Total Balance</strong><br><div class="amount">${money(c.total)}</div></div><div class="stat"><strong>Net Worth</strong><br><div class="amount">${money(c.netWorth)}</div></div><div class="stat"><strong>Total Income</strong><br><div class="amount positive">${money(c.income)}</div></div><div class="stat"><strong>Total Expenses</strong><br><div class="amount negative">${money(c.expense)}</div></div></div></div><div class="section"><h2>📈 Accounts</h2>${accounts.map(a=>`<div><strong>${a}</strong>: ${money(c.bal[a])}</div>`).join('')}</div><div class="section"><h2>📝 Recent Transactions</h2><table><tr><th>Date</th><th>Type</th><th>Category</th><th>Amount</th></tr>${u.transactions.slice(-10).reverse().map(x=>`<tr><td>${x.date}</td><td>${x.type}</td><td>${x.category||'-'}</td><td class="${['Income','Received'].includes(x.type)?'positive':'negative'}">${money(x.amount)}</td></tr>`).join('')}</table></div><div class="section"><h2>🎯 Goals Progress</h2>${u.goals.length?u.goals.map(g=>{let saved=u.transactions.filter(x=>x.category===g.category&&x.type==='Income').reduce((a,x)=>a+x.amount,0);return`<div><strong>${g.name}</strong>: ${money(saved)} / ${money(g.target)} (${Math.min(100,(saved/g.target)*100).toFixed(0)}%)</div>`}).join(''):'<div>No goals set</div>'}</div><div class="footer">MR ELON ALI - Ultimate Finance Manager | Data stored locally</div></body></html>`;let blob=new Blob([html],{type:'text/html'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`mr-elon-ali-report-${today()}.html`;a.click();showToast('✅ PDF Report generated','success')}
function exportCSV(){let rows=[['Date','Type','Category','Account','Amount','Description','Tags']];current().transactions.forEach(x=>{rows.push([x.date,x.type,x.category||'',x.account||'',x.amount,(x.description||''),(x.tags||[]).join(', ')]);});let csv=rows.map(r=>r.join(',')).join('\n');let blob=new Blob([csv],{type:'text/csv'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`mr-elon-ali-transactions-${today()}.csv`;a.click();showToast('✅ CSV Exported','success')}

function closeModal(){$('#modalRoot').innerHTML=''}
